<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Stars Collection</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-content">
        <h1 class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
          <span>GitHub Stars</span>
        </h1>
        <div class="header-actions">
          <span class="stats" id="stats">Loading...</span>
          <button class="btn btn-primary" id="updateBtn" title="Update from GitHub (requires GitHub Action)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
            <span>Update</span>
          </button>
        </div>
      </div>
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="search" id="searchInput" placeholder="Search by name, description, language..." autocomplete="off">
        <button class="clear-search" id="clearSearch" aria-label="Clear search">✕</button>
      </div>
    </header>

    <main class="main">
      <aside class="sidebar">
        <div class="filter-section">
          <h2 class="filter-title">Categories</h2>
          <div class="filter-tags" id="categoryTags"></div>
        </div>
        <div class="filter-section">
          <h2 class="filter-title">Languages</h2>
          <div class="filter-tags" id="languageTags"></div>
        </div>
        <div class="filter-section">
          <h2 class="filter-title">Sort</h2>
          <select id="sortSelect" class="sort-select">
            <option value="stars-desc">Stars (High → Low)</option>
            <option value="stars-asc">Stars (Low → High)</option>
            <option value="name-asc">Name (A → Z)</option>
            <option value="name-desc">Name (Z → A)</option>
            <option value="pushed-desc">Recently Updated</option>
          </select>
        </div>
      </aside>

      <section class="content">
        <div class="results-header">
          <span class="results-count" id="resultsCount">—</span>
          <div class="view-toggle">
            <button class="view-btn active" data-view="grid" aria-label="Grid view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
            <button class="view-btn" data-view="list" aria-label="List view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
          </div>
        </div>
        <div class="repos-grid" id="reposGrid"></div>
        <div class="empty-state" id="emptyState" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <p>No repositories match your filters</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>Data from <a href="https://github.com/cheer4u" target="_blank" rel="noopener">@cheer4u</a>'s starred repos · 
      <a href="https://github.com/cheer4u/github-stars-site" target="_blank" rel="noopener">Source</a> · 
      Last updated: <span id="lastUpdated">—</span></p>
    </footer>
  </div>

  <script src="data.json"></script>
  <script src="app.js"></script>
</body>
</html>
