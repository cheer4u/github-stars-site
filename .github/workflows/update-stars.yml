name: Update stars data

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 3 * * *'   # UTC 03:17 = 北京时间 11:17

permissions:
  contents: write

concurrency:
  group: update-stars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch starred repos (public API, paginated)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --paginate --slurp "/users/cheer4u/starred?per_page=100" > starred_raw.json

      - name: Build data.js
        run: python3 build_data.py starred_raw.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: 更新收藏数据"
            git push
          fi
